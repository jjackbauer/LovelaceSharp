<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lovelace.Studio</title>
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
  <header id="toolbar">
    <div class="toolbar-group">
      <button id="run-btn" class="primary icon-btn" title="Run the script (Ctrl+Enter)" aria-label="Run"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></button>
      <button id="clear-btn" class="icon-btn" title="Clear all variables (functions remain)" aria-label="Clear"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M6.5 4V2.5h3V4M3.5 4l.7 9.5h7.6l.7-9.5M6.5 7v4M9.5 7v4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="save-btn" class="icon-btn" title="Save editor content to localStorage" aria-label="Save"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h8l3 3v8h-11zM5.5 2.5V6h5V2.5M5.5 13.5v-4h5v4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <button id="load-btn" class="icon-btn" title="Load editor content from localStorage" aria-label="Load"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5V3.5l1.5-1.5h4L8.5 3.5h5v9.5h-12z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
    </div>

    <div class="toolbar-progress" id="toolbar-progress" hidden>
      <div class="progress-track"><div id="progress-fill"></div></div>
      <span id="progress-label" class="progress-label" title=""></span>
      <button id="progress-cancel" class="icon-btn danger" title="Cancel run" aria-label="Cancel run"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>

    <div class="toolbar-group precision-group">
      <span id="precision-readout" class="readout" title="Precision (decimal places)">1000 digits</span>
      <input id="precision-input" type="number" min="1" step="1" placeholder="1000" />
      <button id="precision-apply" class="icon-btn" title="Set precision (computation + display)" aria-label="Set precision"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="toolbar-group">
      <span id="cursor-pos" class="readout">Ln 1, Col 1</span>
      <span id="status" class="readout">rev 0</span>
    </div>
  </header>

  <div id="main-row">
    <section id="editor-pane" class="pane" data-group="main">
      <div class="pane-header">
        <span class="pane-title">Script</span>
        <span class="pane-actions">
          <button class="pane-btn pane-min" title="Minimize" aria-label="Minimize">–</button>
          <button class="pane-btn pane-max" title="Maximize" aria-label="Maximize">□</button>
        </span>
      </div>
      <div class="pane-body">
        <div id="editor"></div>
      </div>
    </section>

    <div class="divider divider-v" id="divider-main" title="Drag to resize"></div>

    <section id="workspace-pane" class="pane" data-group="main">
      <div class="pane-header">
        <span class="pane-title">Workspace</span>
        <span class="pane-actions">
          <button class="pane-btn pane-min" title="Minimize" aria-label="Minimize">–</button>
          <button class="pane-btn pane-max" title="Maximize" aria-label="Maximize">□</button>
        </span>
      </div>
      <div class="pane-body">
        <div id="variables-panel">
          <h3>Variables</h3>
          <table id="variables-table">
            <thead><tr><th>Name</th><th>Value</th><th>Type</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
          <div id="variables-empty" class="empty-hint">no variables</div>
        </div>
        <div id="functions-panel">
          <h3>Functions</h3>
          <table id="functions-table">
            <thead><tr><th>Name</th><th>Parameters</th><th>Kind</th></tr></thead>
            <tbody></tbody>
          </table>
          <div id="functions-empty" class="empty-hint">no functions</div>
        </div>
      </div>
    </section>
  </div>

  <div class="divider divider-h" id="divider-graph" title="Drag to resize"></div>

  <section id="graph-pane" class="pane" data-group="bottom">
    <div class="pane-header">
      <span class="pane-title">Graph</span>
      <span class="pane-actions">
        <button class="pane-btn pane-min" title="Minimize" aria-label="Minimize">–</button>
        <button class="pane-btn pane-max" title="Maximize" aria-label="Maximize">□</button>
      </span>
    </div>
    <div class="pane-body">
      <div id="graph-container">
        <div id="graph-placeholder" class="empty-hint">no plot yet</div>
      </div>
    </div>
  </section>

  <div class="divider divider-h" id="divider-logs" title="Drag to resize"></div>

  <section id="logs-pane" class="pane" data-group="bottom">
    <div class="pane-header">
      <span class="pane-title">Logs</span>
      <input id="quick-eval" type="text" placeholder="quick eval — one-liner, press Enter" spellcheck="false" autocomplete="off" />
      <span class="pane-actions">
        <button class="pane-btn pane-min" title="Minimize" aria-label="Minimize">–</button>
        <button class="pane-btn pane-max" title="Maximize" aria-label="Maximize">□</button>
      </span>
    </div>
    <div class="pane-body">
      <div id="logs" class="log-output" aria-live="polite"></div>
    </div>
  </section>

  <script type="module" src="app.js?v=10"></script>
</body>
</html>
