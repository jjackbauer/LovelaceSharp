# CI — fast test suites (third-party verification)
#
# Runs every test suite with coverage collection and uploads the merged reports
# to Codecov (see the coverage badge in README.md). The 1000-digit Pi/sqrt tests
# in Lovelace.Real.Tests carry [Trait("Category", "Heavy")] and are filtered out
# here so the job stays fast; the full high-precision suite remains runnable
# locally with `dotnet test Lovelace.Real.Tests/Lovelace.Real.Tests.csproj`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Fast accuracy test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # id-token: write lets codecov-action exchange a GitHub OIDC token for
    # tokenless uploads (public repo); contents: read is needed by checkout.
    permissions:
      contents: read
      id-token: write

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # Test projects target net10.0; installs the latest 10.0 SDK if the
          # runner image does not already carry it.
          dotnet-version: '10.0.x'

      # Build-only gate. The benchmark itself is a ShortRun sweep that takes many
      # minutes, so CI compiles the harness (and its new Suite/Dsp rows) but never
      # runs it; the recorded baseline lives in benchmarks/symbench-baseline.md.
      - name: Build symbench (benchmark harness)
        shell: bash
        run: |
          set -euo pipefail
          dotnet build symbench/symbench.csproj --configuration Release --nologo

      - name: Run fast test suites
        shell: bash
        run: |
          set -euo pipefail
          suites=(
            Lovelace.Abstractions.Tests/Lovelace.Abstractions.Tests.csproj
            Lovelace.Array.Tests/Lovelace.Array.Tests.csproj
            Lovelace.Complex.Tests/Lovelace.Complex.Tests.csproj
            Lovelace.Console.Tests/Lovelace.Console.Tests.csproj
            Lovelace.Dsp.Tests/Lovelace.Dsp.Tests.csproj
            Lovelace.Integer.Tests/Lovelace.Integer.Tests.csproj
            Lovelace.Knowledge.Tests/Lovelace.Knowledge.Tests.csproj
            Lovelace.Natural.Tests/Lovelace.Natural.Tests.csproj
            Lovelace.Representation.Tests/Lovelace.Representation.Tests.csproj
            # Agent-facing wire contract: golden fixtures pin the runner's JSON
            # envelope, and one test spawns the runner to prove stdout purity.
            Lovelace.Run.Tests/Lovelace.Run.Tests.csproj
            Lovelace.Studio.Tests/Lovelace.Studio.Tests.csproj
            Lovelace.Suite.Tests/Lovelace.Suite.Tests.csproj
            Lovelace.Symbolics.Tests/Lovelace.Symbolics.Tests.csproj
            # Accuracy verifier: Lovelace.Real @ 8/16 digits vs float/double,
            # asserted against a high-precision reference (fast — only the
            # low-precision sqrt paths).
            precbench.Tests/precbench.Tests.csproj
          )
          # Category=Timing is excluded here and run in its own uninstrumented step below:
          # its assertions are WALL-CLOCK verdicts and the coverage collector inflates them
          # (cycle 6: a 1.5 s cancellation budget measured 29 s under the collector on a
          # loaded runner and turned this job red; cycle 5 hit the same class in
          # Lovelace.Real.Tests). Excluded from the instrumented loop, never skipped.
          for project in "${suites[@]}"; do
            echo "::group::dotnet test $project"
            dotnet test "$project" --configuration Release --nologo \
              --filter "Category!=Timing" \
              --collect:"XPlat Code Coverage"
            echo "::endgroup::"
          done

      - name: Run Lovelace.Real.Tests (correctness subset)
        shell: bash
        run: |
          set -euo pipefail
          # Heavy 1000-digit Pi/sqrt tests are tagged [Trait("Category", "Heavy")]
          # and skipped here so the job stays fast. Timing assertions are excluded as
          # well: they are wall-clock verdicts and coverage instrumentation inflates
          # them (cycle 5: a healthy 1 s cosine crossed its 10 s budget under the
          # collector and turned this job red). They run, uninstrumented, in the next
          # step — excluded here, never skipped.
          dotnet test Lovelace.Real.Tests/Lovelace.Real.Tests.csproj \
            --configuration Release --nologo \
            --filter "Category!=Heavy&Category!=Timing" \
            --collect:"XPlat Code Coverage"

      - name: Run the timing assertions uninstrumented
        shell: bash
        run: |
          set -euo pipefail
          # Category=Timing must still run in CI, without a coverage collector, so its
          # wall-clock budget means what it says. Every project that carries one runs here.
          dotnet test Lovelace.Real.Tests/Lovelace.Real.Tests.csproj \
            --configuration Release --nologo \
            --filter "Category=Timing"
          dotnet test Lovelace.Suite.Tests/Lovelace.Suite.Tests.csproj \
            --configuration Release --nologo \
            --filter "Category=Timing"
          dotnet test Lovelace.Symbolics.Tests/Lovelace.Symbolics.Tests.csproj \
            --configuration Release --nologo \
            --filter "Category=Timing"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: '**/TestResults/**/coverage.cobertura.xml'
          # Public repo: authenticate via GitHub OIDC instead of a token.
          use_oidc: true
          fail_ci_if_error: true

  # ---------------------------------------------------------------------------
  # Differential oracle: SymPy IS installed here, and its absence is FATAL.
  #
  # The oracle compares kernel results against SymPy. Everywhere else the tests
  # report SKIPPED (with the reason) when python3 + sympy are missing — never a
  # silent pass. This job is the one place where the comparison actually runs:
  # python3 is set up, sympy is installed, and LOVELACE_REQUIRE_SYMPY=1 turns a
  # missing oracle into a FAILURE instead of a skip.
  # ---------------------------------------------------------------------------
  sympy-oracle:
    name: Differential oracle (SymPy installed)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Required, not optional: a run that cannot compare anything must fail.
      LOVELACE_REQUIRE_SYMPY: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # setup-python (not the runner's system python) keeps `pip install` out of
      # PEP 668's externally-managed environment; the oracle spawns `python3`.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sympy and prove python3 can import it
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install sympy
          python3 -c "import sympy; print('sympy', sympy.__version__)"

      - name: Run the differential oracle (an unavailable oracle fails the job)
        shell: bash
        run: |
          set -euo pipefail
          dotnet test Lovelace.Symbolics.Tests/Lovelace.Symbolics.Tests.csproj \
            --configuration Release --nologo \
            --filter "FullyQualifiedName~DifferentialOracle" \
            --logger "console;verbosity=detailed"

  # ---------------------------------------------------------------------------
  # Native AOT publish + published-runner execution smoke.
  #
  # The runner is published as a Native AOT binary and then EXERCISED: the
  # published executable must emit a versioned JSON envelope whose structured
  # fields an agent can read without parsing display text. This is the gate that
  # keeps the protocol honest — the unit suites cannot see a packaging regression.
  # ---------------------------------------------------------------------------
  aot-smoke:
    name: Native AOT publish + runner smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install AOT toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish Lovelace.Run (Native AOT)
        run: |
          dotnet publish Lovelace.Run/Lovelace.Run.csproj \
            --configuration Release \
            -p:PublishAot=true \
            -p:InvariantGlobalization=true \
            -o out/aot

      - name: Upload the published runner (self-contained linux-x64 artifact)
        uses: actions/upload-artifact@v4
        with:
          name: lovelace-run-linux-x64
          path: out/aot/Lovelace.Run
          if-no-files-found: error

      - name: Smoke — the published runner answers protocol questions
        shell: bash
        run: |
          set -euo pipefail
          exe=out/aot/Lovelace.Run
          chmod +x "$exe"

          # 1. a complete solve reports Solved / Complete with per-solution conditions
          cat > /tmp/solve.ls <<'EOF'
          x = symbol("x")
          solve_full(x^2 - 4 == 0, x)
          EOF
          "$exe" --file /tmp/solve.ls --omit-functions > /tmp/solve.json
          python3 - <<'PY'
          import json
          env = json.load(open('/tmp/solve.json'))
          assert env['ok'] is True, env
          assert env['protocolVersion'] == 1
          assert env['symbolicFormatVersion'].startswith('#!lovelace-sym')
          assert env['mathIrVersion'] >= 1
          s = env['result']['structured']
          assert s['kind'] == 'Record' and s['type'] == 'SolveResult', s
          fields = {f['name']: f['value'] for f in s['fields']}
          # D2: the VALUE assertions stay; the KIND is asserted too, because "Solved" as Text
          # would make an agent guess which enum it belongs to (this is the packaging gate for
          # the Enum form — a published binary that lost it fails here)
          assert fields['status']['value'] == 'Solved'
          assert fields['status']['kind'] == 'Enum', fields['status']
          assert fields['status']['type'] == 'SolveStatus', fields['status']
          assert fields['completeness']['kind'] == 'Enum', fields['completeness']
          assert fields['completeness']['type'] == 'Completeness', fields['completeness']
          # REPAIR (round 4a): a structured Boolean crosses as the STRING "true"/"false"
          # (dsh-protocol.md value forms; pinned by Lovelace.Run.Tests/fixtures/record.json), so
          # "is True" could never hold and this step died before reaching the Enum assertions
          # below. Same intent, corrected representation, plus the kind it travels as.
          assert fields['complete']['kind'] == 'Boolean', fields['complete']
          assert fields['complete']['value'] == 'true', fields['complete']
          assert fields['domain']['kind'] == 'Domain' and fields['domain']['domain'] == 'complex'
          sols = fields['solutions']
          assert sols['kind'] == 'Array' and sols['shape'] == [2], sols
          first = sols['elements'][0]
          sf = {f['name']: f['value'] for f in first['fields']}
          assert sf['value']['kind'] == 'Symbolic'
          assert sf['value']['canonical'].startswith('(rat'), sf['value']['canonical']
          assert sf['exactness']['value'] in ('Exact', 'AlgebraicExact')
          assert sf['exactness']['kind'] == 'Enum', sf['exactness']
          assert sf['exactness']['type'] == 'SolutionExactness', sf['exactness']
          print('solve envelope OK')
          PY

          # 2. an incomplete solve over the complex field must NOT claim completeness
          cat > /tmp/partial.ls <<'EOF'
          x = symbol("x")
          solve_full(x^4 - x^2 - 1 == 0, x)
          EOF
          "$exe" --file /tmp/partial.ls --omit-functions > /tmp/partial.json
          python3 - <<'PY'
          import json
          env = json.load(open('/tmp/partial.json'))
          fields = {f['name']: f['value'] for f in env['result']['structured']['fields']}
          assert fields['status']['value'] == 'Partial', fields['status']
          assert fields['status']['kind'] == 'Enum', fields['status']
          assert fields['status']['type'] == 'SolveStatus', fields['status']
          assert fields['completeness']['kind'] == 'Enum', fields['completeness']
          assert fields['completeness']['value'] == 'Partial', fields['completeness']
          # REPAIR (round 4a): see step 1 — a structured Boolean is the string "false"
          assert fields['complete']['kind'] == 'Boolean', fields['complete']
          assert fields['complete']['value'] == 'false', fields['complete']
          assert int(fields['unrepresented_count']['value']) == 2
          print('completeness envelope OK')
          PY

          # 3. arrays preserve shape into the protocol
          cat > /tmp/jac.ls <<'EOF'
          x = symbol("x")
          y = symbol("y")
          jacobian([x*y, x+y], [x, y])
          EOF
          "$exe" --file /tmp/jac.ls --omit-functions > /tmp/jac.json
          python3 - <<'PY'
          import json
          env = json.load(open('/tmp/jac.json'))
          s = env['result']['structured']
          # rank-2 arrays serialize row-major with an explicit shape
          assert s['kind'] == 'Array' and s['shape'] == [2, 2], s
          assert len(s['elements']) == 4
          assert s['elements'][0]['kind'] == 'Symbolic'
          assert s['elements'][0]['canonical'] == '(sym y)', s['elements'][0]
          print('array envelope OK')
          PY

          # 4. stdout carries the envelope and nothing else, even when the script prints
          cat > /tmp/print.ls <<'EOF'
          print("hello from the script")
          1 + 1
          EOF
          "$exe" --file /tmp/print.ls --omit-functions > /tmp/print.json
          python3 - <<'PY'
          import json
          env = json.load(open('/tmp/print.json'))
          assert env['output'] == ['hello from the script'], env['output']
          assert env['result']['structured']['value'] == '2'
          print('stdout purity OK')
          PY

          # 5. errors are structural: code + category, never message matching
          cat > /tmp/err.ls <<'EOF'
          x = symbol("x")
          solve(x^2 + 1 == 0, x, integer)
          EOF
          if "$exe" --file /tmp/err.ls --omit-functions > /tmp/err.json; then
            echo "expected a non-zero exit for an unsupported domain"; exit 1
          fi
          python3 - <<'PY'
          import json
          env = json.load(open('/tmp/err.json'))
          assert env['ok'] is False
          assert 'got integer' in env['message']
          assert env['code'] and env['category'], env
          print('error envelope OK')
          PY

